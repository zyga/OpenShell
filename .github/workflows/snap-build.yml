name: Smoke test build using new scripts

on:
  push:
    branches: [ snapify ]
    tags: [ 'v*' ]

env:
  SNAP_NAME: openshell
  DEFAULT_TRACK: latest
  DEFAULT_RISK: edge
  PROMOTE_TO_RISK: candidate

jobs:
  build-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt install -y umoci jq zstd fakeroot
          sudo snap install --classic snapcraft
          sudo snap install --classic rockcraft
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
      - name: Build VM rootfs with rockcraft
        run: ./tasks/scripts/vm/build-rockcraft-rootfs.sh
      - name: Upload rockcraft logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rockcraft-logs
          path: /home/runner/.local/state/rockcraft/log/rockcraft-*.log
      - name: Build openshell core rock
        run: ./tasks/scripts/build-rock.sh
      - name: Build openshell snap
        run: ./tasks/scripts/build-snap.sh
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: openshell-snap
          path: openshell_*.snap

      - name: Release to ${{ env.DEFAULT_TRACK }}/${{ env.DEFAULT_RISK }}
        if: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: openshell_*.snap
          release: ${{ env.DEFAULT_TRACK }}/${{ env.DEFAULT_RISK }}

  promote:
    runs-on: ubuntu-latest
    needs: [build-snap]
    if: needs.build-snap.result == 'success' && secrets.SNAPCRAFT_STORE_CREDENTIALS != '' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Get current revision in ${{ env.DEFAULT_TRACK }}/${{ env.DEFAULT_RISK }}
        id: get-revision
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft status "$SNAP_NAME" --track "$DEFAULT_TRACK" \
            | awk 'NR==1 { pos = index($0, "Revision") } /edge/ { print 0+substr($0, pos) }' \
            > revision.txt
          echo "Revision: $(cat revision.txt)"
          echo "revision=$(cat revision.txt)" >> "$GITHUB_OUTPUT"

      - name: Promote to ${{ env.DEFAULT_TRACK }}/${{ env.PROMOTE_TO_RISK }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft release "$SNAP_NAME" \
            "${{ steps.get-revision.outputs.revision }}" \
            "${DEFAULT_TRACK}/${PROMOTE_TO_RISK}"
