project: openshell

backends:
    garden:
        type: adhoc
        allocate: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            exec image-garden allocate --spread "$SPREAD_SYSTEM"."$(uname -m)"
        discard: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            image-garden discard "$SPREAD_SYSTEM_ADDRESS"
        systems:
            - ubuntu-cloud-24.04:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-cloud-26.04:
                  username: ubuntu
                  password: ubuntu
            - debian-cloud-13:
                  username: debian
                  password: debian
            - fedora-cloud-44:
                  username: fedora
                  password: fedora
            - centos-cloud-10:
                  username: centos
                  password: centos

exclude:
    - ".cache/*"
    - ".image-garden/*"
    - "target/*"

path: /root/openshell


environment:
  # The default container is large and instead of putting it in the pre-built
  # qemu image, we are getting it externally.  This approach is more friendly
  # to storing the file in GitHub actions cache and sharing it across test jobs
  # without abusing the cache size limit.
  CONTAINER_FILE: "$(HOST: if [ ! -e base-container.tar ]; then docker image pull ghcr.io/nvidia/openshell-community/sandboxes/base:latest && docker image save -o base-container.tar ghcr.io/nvidia/openshell-community/sandboxes/base:latest; fi >&2 && echo base-container.tar)"
  SNAP_FILE: "$(HOST: ls ./openshell_*.snap | sort -r | head -n 1 || exit 1)"

prepare: |
    # Wait for docker socket to show up.
    while [ ! -S /run/docker.sock ]; do sleep 1; done
    # Load the container we receive from the host.
    echo "$CONTAINER_FILE"
    docker image load < "$CONTAINER_FILE"
    docker image ls | MATCH ghcr.io/nvidia/openshell-community/sandboxes/base:latest

    # Install the openshell snap that was copied into the test environment.
    snap install --dangerous "$SNAP_FILE"

    # Connect snap interfaces. When installing from the store this
    # is auto-connected by the snap declaration assertion, but locally
    # we need to do it manually.
    snap connect openshell:docker docker:docker-daemon
    snap connect openshell:log-observe
    snap connect openshell:system-observe
    snap connect openshell:ssh-keys

    # Add the local gateway to user configuration.
    openshell gateway add http://127.0.0.1:17670 --local --name snap-docker
    openshell gateway select snap-docker
    openshell status

debug-each: |
    echo "Kernel and architecture:"
    uname -a

    echo "OS release info:"
    cat /etc/os-release

    echo "Installed snaps:"
    snap list

    set +e

    echo "Snap connections of the openshell snap:"
    snap connections openshell

    echo "Openshell version:"
    snap run openshell --version

suites:
    tests/:
        summary: Smoke tests for OpenShell snap
