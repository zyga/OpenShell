summary: Smoke test for openshell snap installation and version check
details: |
    This test verifies that the openshell snap is properly installed
    and that the openshell command is available and functional.

prepare: |
    # Connect kvm plug for sandbox runtime
    sudo snap connect openshell:kvm
    # Set driver to vm (k8s support is WIP)
    snap set openshell driver=vm
    # Wait for gateway socket to be ready
    for _ in $(seq 1 30); do
        [ -S /var/snap/openshell/common/run/gateway.sock ] && break
        sleep 1
    done
    snap run openshell sandbox list | MATCH "No sandboxes found."

execute: |
    snap run openshell sandbox create -- echo "Hello, OpenShell!" | MATCH "Hello, OpenShell!"
    snap run openshell sandbox list | MATCH ".*Ready"

restore: |
    # Wait for gateway socket before attempting cleanup
    for _ in $(seq 1 10); do
        [ -S /var/snap/openshell/common/run/gateway.sock ] && break
        sleep 1
    done
    # Delete sandboxes, ignore errors if gateway is unavailable
    snap run openshell sandbox delete --all | MATCH ".*Deleted.*"
    snap run openshell sandbox list | MATCH "No sandboxes found."
